name: ttrpg-tests

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ttrpg-test-only
      MYSQL_ROOT_HOST: '%'
    ports:
      - '127.0.0.1:3307:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -u root -e "SELECT 1"']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
